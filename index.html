<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Conteúdo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 24px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #resultado {
      display: none;
      margin-top: 30px;
      padding: 24px;
      background: #f7f7f7;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Gerador de Conteúdo</h1>

      <p>
        Crie automaticamente um conteúdo para divulgar sua ação.
      </p>

      <label for="empresa">Nome da empresa</label>
      <input
        type="text"
        id="empresa"
        placeholder="Ex.: Empresa Exemplo"
      >

      <label for="acao">O que você quer divulgar?</label>
      <textarea
        id="acao"
        placeholder="Ex.: Workshop de preparação para o mercado de trabalho para jovens."
      ></textarea>

      <label for="logo">Logo da empresa parceira</label>

<input
  type="file"
  id="logo"
  accept="image/png,image/jpeg,image/webp,image/svg+xml"
/>

<p style="font-size: 13px; color: #666;">
  Envie o logo da sua empresa. Prefira PNG com fundo transparente.
</p>

      <button onclick="gerarConteudo()">
        GERAR CONTEÚDO
      </button>

      <div id="resultado">

        <h2>Seu conteúdo</h2>

        <p id="conteudo"></p>

      </div>

    </div>

  </div>

  <script>
async function gerarConteudo() {

  const empresa = document.getElementById("empresa").value;
  const acao = document.getElementById("acao").value;
  const logo = document.getElementById("logo").files[0];
  const logoBase64 = await new Promise((resolve, reject) => {
  const reader = new FileReader();

  reader.onload = () => resolve(reader.result);
  reader.onerror = () => reject(new Error("Não foi possível ler o logo."));

  reader.readAsDataURL(logo);
});

if (!empresa || !acao || !logo) {
  alert("Preencha a empresa, a ação e envie o logo.");
  return;
}

  const resultado = document.getElementById("resultado");
  const conteudo = document.getElementById("conteudo");

  resultado.style.display = "block";

  conteudo.innerHTML = "🤖 Criando seu conteúdo...";

  try {

    const resposta = await fetch(
      "https://gerador-conteudo-api.oyuriveleda.workers.dev",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
  empresa: empresa,
  acao: acao,
  logo: logoBase64,
  logoTipo: logo.type
})

    const dados = await resposta.json();

 if (!resposta.ok) {
  throw new Error(
    dados.detalhes
      ? JSON.stringify(dados.detalhes)
      : (dados.erro || "Erro ao gerar conteúdo.")
  );
}

    conteudo.innerHTML =
      dados.conteudo.replace(/\n/g, "<br>");

  } catch (erro) {

    conteudo.innerHTML =
      "❌ Erro ao gerar conteúdo:<br><br>" +
      erro.message;

  }
}
  </script>

</body>
</html>
